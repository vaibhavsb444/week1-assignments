  <text x="148" y="58" fill="#38bdf8" font-family="monospace" font-size="11">⚡ api-pipeline.ts</text>
  <rect x="280" y="38" width="130" height="32" rx="6" fill="#111827" />
  <text x="295" y="58" fill="#6b7280" font-family="monospace" font-size="11">schema.graphql</text>

  <!-- Left Sidebar (File Explorer) -->
  <rect x="40" y="70" width="160" height="380" fill="#0d111d" border-right="1px solid #1f2937" />
  <text x="55" y="98" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">EXPLORER</text>
  <text x="65" y="125" fill="#e5e7eb" font-family="monospace" font-size="11">▾ src</text>
  <text x="80" y="145" fill="#93c5fd" font-family="monospace" font-size="11">▸ components</text>
  <text x="80" y="165" fill="#93c5fd" font-family="monospace" font-size="11">▸ hooks</text>
  <text x="80" y="185" fill="#38bdf8" font-family="monospace" font-size="11">⚡ api-pipeline.ts</text>
  <text x="80" y="205" fill="#93c5fd" font-family="monospace" font-size="11">▸ services</text>
  <text x="65" y="235" fill="#9ca3af" font-family="monospace" font-size="11">▾ tests</text>
  <text x="80" y="255" fill="#34d399" font-family="monospace" font-size="11">✓ pipeline.spec.ts</text>

  <!-- Code Area -->
  <g font-family="monospace" font-size="12">
    <text x="225" y="110" fill="#6b7280">01</text>
    <text x="255" y="110"><tspan fill="#f43f5e">import</tspan> <tspan fill="#e5e7eb">{ pipeline, transform } </tspan><tspan fill="#f43f5e">from</tspan> <tspan fill="#34d399">'@devpulse/core'</tspan>;</text>
    
    <text x="225" y="135" fill="#6b7280">02</text>
    <text x="255" y="135"><tspan fill="#f43f5e">export const</tspan> <tspan fill="#fbbf24">syncAnalyticsEngine</tspan> = <tspan fill="#818cf8">async</tspan> (req: <tspan fill="#22d3ee">Request</tspan>) =&gt; {</text>

    <text x="225" y="160" fill="#6b7280">03</text>
    <text x="275" y="160"><tspan fill="#f43f5e">const</tspan> session = <tspan fill="#818cf8">await</tspan> <tspan fill="#60a5fa">verifyAuthToken</tspan>(req.headers);</text>

    <text x="225" y="185" fill="#6b7280">04</text>
    <text x="275" y="185"><tspan fill="#f43f5e">const</tspan> telemetry = <tspan fill="#818cf8">await</tspan> <tspan fill="#60a5fa">streamMetrics</tspan>({ bufferLimit: <tspan fill="#c084fc">1024</tspan> });</text>

    <text x="225" y="210" fill="#6b7280">05</text>
    <text x="275" y="210"><tspan fill="#f43f5e">return</tspan> <tspan fill="#22d3ee">pipeline</tspan>.<tspan fill="#60a5fa">dispatch</tspan>({ session, telemetry, timestamp: <tspan fill="#c084fc">Date.now()</tspan> });</text>

    <text x="225" y="235" fill="#6b7280">06</text>
    <text x="255" y="235"><tspan fill="#e5e7eb">};</tspan></text>
  </g>

  <!-- Live Terminal at bottom -->
  <rect x="200" y="280" width="560" height="170" fill="#030712" border-top="1px solid #1f2937" />
  <rect x="220" y="295" width="80" height="20" rx="4" fill="#1e293b" />
