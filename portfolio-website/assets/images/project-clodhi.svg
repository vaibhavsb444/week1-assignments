<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="clodhi-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <linearGradient id="fire-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="480" fill="url(#clodhi-bg)" />

  <!-- App Window Container -->
  <rect x="40" y="30" width="720" height="420" rx="14" fill="#09090b" stroke="#3f3f46" stroke-width="1.5" />

  <!-- Window Chrome Header -->
  <path d="M 40 44 C 40 36.27 46.27 30 54 30 L 746 30 C 753.73 30 760 36.27 760 44 L 760 72 L 40 72 Z" fill="#18181b" />
  <circle cx="65" cy="51" r="5" fill="#ef4444" />
  <circle cx="82" cy="51" r="5" fill="#f59e0b" />
  <circle cx="99" cy="51" r="5" fill="#10b981" />
  <rect x="150" y="43" width="280" height="18" rx="9" fill="#09090b" />
  <text x="170" y="56" fill="#f43f5e" font-family="monospace" font-size="10.5">https://clodhi.com/storefront [React + Vite]</text>

  <!-- Top Navigation Bar in Storefront -->
  <rect x="40" y="72" width="720" height="50" fill="#18181b" border-bottom="1px solid #27272a" />
  <text x="65" y="103" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="900" letter-spacing="2">CLODHI<tspan fill="#f97316">.</tspan></text>
  
  <text x="210" y="102" fill="#e4e4e7" font-family="sans-serif" font-size="12" font-weight="600">NEW ARRIVALS</text>
  <text x="330" y="102" fill="#a1a1aa" font-family="sans-serif" font-size="12">HOODIES</text>
  <text x="420" y="102" fill="#a1a1aa" font-family="sans-serif" font-size="12">OVERSIZED TEES</text>
  <text x="550" y="102" fill="#a1a1aa" font-family="sans-serif" font-size="12">CARGOS</text>

  <!-- Firebase Auth Pill & Cart -->
  <rect x="640" y="86" width="100" height="26" rx="13" fill="url(#fire-grad)" />
  <text x="655" y="103" fill="#ffffff" font-family="sans-serif" font-size="10.5" font-weight="bold">CART (3) 🛍️</text>

  <!-- Hero Promo Banner -->
  <rect x="65" y="135" width="670" height="90" rx="10" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
  <text x="90" y="168" fill="#f97316" font-family="sans-serif" font-size="10" font-weight="bold" letter-spacing="1.5">LIMITED EDITION DROP</text>
  <text x="90" y="196" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">CYBERPUNK ACID OVERSIZED HOODIE</text>
  <text x="90" y="214" fill="#a1a1aa" font-family="sans-serif" font-size="11">Heavyweight 420 GSM French Terry • Pre-shrunk Boxy Fit</text>

  <rect x="560" y="155" width="150" height="48" rx="8" fill="#ffffff" />
  <text x="580" y="184" fill="#09090b" font-family="sans-serif" font-size="12" font-weight="bold">SHOP DROP →</text>

  <!-- Product Grid -->
  <!-- Product 1 -->
  <g transform="translate(65, 240)">
    <rect width="210" height="185" rx="10" fill="url(#card-grad)" stroke="#3f3f46" stroke-width="1" />
    <rect x="10" y="10" width="190" height="105" rx="6" fill="#09090b" />
    <!-- T-Shirt silhouette illustration -->
    <path d="M 65 35 L 85 25 L 125 25 L 145 35 L 155 60 L 140 65 L 132 50 L 132 100 L 78 100 L 78 50 L 70 65 L 55 60 Z" fill="#3f3f46" />
    <text x="88" y="70" fill="#f97316" font-family="monospace" font-size="8" font-weight="bold">CLODHI</text>
    <text x="15" y="135" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Acid Wash Oversized Tee</text>
    <text x="15" y="152" fill="#a1a1aa" font-family="sans-serif" font-size="10">Vintage Black • 240 GSM</text>
    <text x="15" y="174" fill="#f97316" font-family="sans-serif" font-size="13" font-weight="bold">₹1,299</text>
    <rect x="135" y="158" width="65" height="20" rx="4" fill="#f97316" />
    <text x="145" y="172" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold">ADD +</text>
  </g>

  <!-- Product 2 -->
  <g transform="translate(295, 240)">
    <rect width="210" height="185" rx="10" fill="url(#card-grad)" stroke="#3f3f46" stroke-width="1" />
    <rect x="10" y="10" width="190" height="105" rx="6" fill="#09090b" />
    <path d="M 65 35 L 85 25 L 125 25 L 145 35 L 155 60 L 140 65 L 132 50 L 132 100 L 78 100 L 78 50 L 70 65 L 55 60 Z" fill="#71717a" />
    <text x="92" y="70" fill="#ffffff" font-family="monospace" font-size="8" font-weight="bold">RAW</text>
    <text x="15" y="135" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Minimal Drop-Shoulder Tee</text>
    <text x="15" y="152" fill="#a1a1aa" font-family="sans-serif" font-size="10">Cloud Grey • Pure Cotton</text>
    <text x="15" y="174" fill="#f97316" font-family="sans-serif" font-size="13" font-weight="bold">₹1,149</text>
    <rect x="135" y="158" width="65" height="20" rx="4" fill="#f97316" />
    <text x="145" y="172" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold">ADD +</text>
  </g>

  <!-- Product 3 -->
  <g transform="translate(525, 240)">
    <rect width="210" height="185" rx="10" fill="url(#card-grad)" stroke="#3f3f46" stroke-width="1" />
    <rect x="10" y="10" width="190" height="105" rx="6" fill="#09090b" />
    <path d="M 60 40 L 80 20 L 130 20 L 150 40 L 160 80 L 140 85 L 135 60 L 135 105 L 75 105 L 75 60 L 70 85 L 50 80 Z" fill="#27272a" stroke="#f97316" stroke-width="1" />
    <text x="15" y="135" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Cyber Matrix Heavy Hoodie</text>
    <text x="15" y="152" fill="#a1a1aa" font-family="sans-serif" font-size="10">Jet Black • Thermal Fleece</text>
    <text x="15" y="174" fill="#f97316" font-family="sans-serif" font-size="13" font-weight="bold">₹2,499</text>
    <rect x="135" y="158" width="65" height="20" rx="4" fill="#f97316" />
    <text x="145" y="172" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold">ADD +</text>
  </g>
</svg>
