<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="cyber-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="50%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fba464" />
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="cyber-jacket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="200" height="200" rx="40" fill="url(#cyber-bg)" />
  
  <!-- Neural Network Mesh Nodes in background -->
  <g opacity="0.35" stroke="#38bdf8" stroke-width="1">
    <line x1="20" y1="35" x2="60" y2="25" />
    <line x1="60" y1="25" x2="85" y2="45" />
    <line x1="140" y1="30" x2="175" y2="45" />
    <line x1="175" y1="45" x2="165" y2="85" />
    <line x1="25" y1="160" x2="55" y2="175" />
    <line x1="150" y1="165" x2="180" y2="155" />
    <circle cx="20" cy="35" r="3" fill="#38bdf8" />
    <circle cx="60" cy="25" r="2.5" fill="#a855f7" />
    <circle cx="85" cy="45" r="2" fill="#38bdf8" />
    <circle cx="140" cy="30" r="2.5" fill="#a855f7" />
    <circle cx="175" cy="45" r="3" fill="#38bdf8" />
    <circle cx="25" cy="160" r="2.5" fill="#06b6d4" />
    <circle cx="55" cy="175" r="2" fill="#38bdf8" />
    <circle cx="150" cy="165" r="2" fill="#a855f7" />
    <circle cx="180" cy="155" r="2.5" fill="#06b6d4" />
  </g>

  <!-- Code / AI Badge overlay -->
  <text x="22" y="55" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.7)" font-weight="bold">&lt;AI/ML&gt;</text>
  <text x="145" y="180" font-family="monospace" font-size="11" fill="rgba(56,189,248,0.9)" font-weight="bold">{FullStack}</text>

  <!-- Shoulders & Cyber Jacket -->
  <path d="M 36 200 C 36 152 68 142 100 142 C 132 142 164 152 164 200 Z" fill="url(#cyber-jacket)" />
  <!-- Neon Jacket Trim -->
  <path d="M 70 148 L 100 178 L 130 148" fill="none" stroke="url(#neon-glow)" stroke-width="2.5" stroke-linecap="round" />
  <!-- Inner shirt -->
  <path d="M 86 148 L 100 172 L 114 148 Z" fill="#ffffff" opacity="0.9" />
  
  <!-- Neck -->
  <rect x="88" y="118" width="24" height="32" rx="6" fill="url(#skin)" />

  <!-- Head -->
  <ellipse cx="100" cy="94" rx="35" ry="42" fill="url(#skin)" />

  <!-- Modern Sleek Glasses -->
  <rect x="74" y="85" width="22" height="15" rx="4" fill="rgba(15, 23, 42, 0.25)" stroke="#0f172a" stroke-width="3" />
  <rect x="104" y="85" width="22" height="15" rx="4" fill="rgba(15, 23, 42, 0.25)" stroke="#0f172a" stroke-width="3" />
  <line x1="96" y1="91" x2="104" y2="91" stroke="#0f172a" stroke-width="3" />
  <!-- Lens reflection -->
  <line x1="77" y1="88" x2="85" y2="96" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="107" y1="88" x2="115" y2="96" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" />

  <!-- Eyes & Eyebrows -->
  <circle cx="85" cy="92" r="2.5" fill="#0f172a" />
  <circle cx="115" cy="92" r="2.5" fill="#0f172a" />
  <path d="M 74 80 Q 84 76 94 80" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 106 80 Q 116 76 126 80" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />

  <!-- Smile -->
  <path d="M 92 115 Q 100 122 108 115" fill="none" stroke="#9a3412" stroke-width="2.8" stroke-linecap="round" />

  <!-- Modern Hair -->
  <path d="M 65 86 C 60 52 82 40 100 40 C 122 40 140 52 135 86 C 131 73 124 64 110 64 C 95 64 80 70 65 86 Z" fill="url(#hair)" />
  <path d="M 67 84 L 69 98 L 73 93 Z" fill="url(#hair)" />
  <path d="M 133 84 L 131 98 L 127 93 Z" fill="url(#hair)" />
</svg>
