<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="shop-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <linearGradient id="prod-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="prod-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="prod-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" fill="url(#shop-bg)" />

  <!-- App Window Frame -->
  <rect x="40" y="30" width="720" height="420" rx="12" fill="#09090b" stroke="#3f3f46" stroke-width="1.5" />
  
  <!-- Browser Chrome -->
  <path d="M 40 42 C 40 35.37 45.37 30 52 30 L 748 30 C 754.63 30 760 35.37 760 42 L 760 70 L 40 70 Z" fill="#18181b" />
  <circle cx="65" cy="50" r="5" fill="#ef4444" />
  <circle cx="82" cy="50" r="5" fill="#f59e0b" />
  <circle cx="99" cy="50" r="5" fill="#10b981" />
  <rect x="150" y="42" width="280" height="16" rx="8" fill="#09090b" />
  <text x="170" y="54" fill="#71717a" font-family="system-ui, sans-serif" font-size="10">shopsphere.store/collection</text>

  <!-- Navbar -->
  <rect x="40" y="70" width="720" height="45" fill="#18181b" border-bottom="1px solid #27272a" />
  <text x="65" y="98" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">ShopSphere</text>
  <rect x="520" y="80" width="140" height="24" rx="12" fill="#27272a" />
  <text x="535" y="96" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="10">Search catalog...</text>
  <circle cx="690" cy="92" r="12" fill="#3f3f46" />
  <text x="686" y="96" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11">🛒</text>
  <circle cx="698" cy="85" r="4" fill="#ec4899" />

  <!-- Hero Promo Banner -->
  <rect x="65" y="130" width="670" height="110" rx="10" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
  <text x="95" y="165" fill="#818cf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">SUMMER DROP 2026</text>
  <text x="95" y="195" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">Next-Gen Minimalist Wear &amp; Gear</text>
  <rect x="95" y="208" width="85" height="22" rx="6" fill="#6366f1" />
  <text x="110" y="223" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Shop Now →</text>

  <!-- Product Grid -->
  <!-- Product 1 -->
  <rect x="65" y="260" width="205" height="170" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
  <rect x="75" y="270" width="185" height="95" rx="6" fill="url(#prod-grad-1)" opacity="0.8" />
  <text x="75" y="382" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Wireless Studio Buds</text>
  <text x="75" y="400" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">Active Noise Cancelling</text>
  <text x="75" y="420" fill="#ec4899" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">$189.00</text>
  <rect x="205" y="405" width="55" height="18" rx="4" fill="#27272a" />
  <text x="215" y="418" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9">+ Add</text>

  <!-- Product 2 -->
  <rect x="295" y="260" width="205" height="170" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
  <rect x="305" y="270" width="185" height="95" rx="6" fill="url(#prod-grad-2)" opacity="0.8" />
  <text x="305" y="382" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Titanium Smart Watch</text>
  <text x="305" y="400" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">Sapphire Display / GPS</text>
  <text x="305" y="420" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">$349.00</text>
  <rect x="435" y="405" width="55" height="18" rx="4" fill="#27272a" />
  <text x="445" y="418" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9">+ Add</text>

  <!-- Product 3 -->
  <rect x="525" y="260" width="210" height="170" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
  <rect x="535" y="270" width="190" height="95" rx="6" fill="url(#prod-grad-3)" opacity="0.8" />
  <text x="535" y="382" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Mechanical Keyboard</text>
  <text x="535" y="400" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">Custom Gasket Hot-Swap</text>
  <text x="535" y="420" fill="#10b981" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">$159.00</text>
  <rect x="670" y="405" width="55" height="18" rx="4" fill="#27272a" />
  <text x="680" y="418" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9">+ Add</text>
</svg>
