<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="vision-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>
    <linearGradient id="neon-scan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.0)" />
      <stop offset="50%" stop-color="rgba(168, 85, 247, 0.3)" />
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0.0)" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#vision-bg)" />

  <!-- App Window Frame -->
  <rect x="40" y="30" width="720" height="420" rx="14" fill="#0b0f19" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Window Chrome Header -->
  <path d="M 40 44 C 40 36.27 46.27 30 54 30 L 746 30 C 753.73 30 760 36.27 760 44 L 760 72 L 40 72 Z" fill="#111827" />
  <circle cx="65" cy="51" r="5" fill="#ef4444" />
  <circle cx="82" cy="51" r="5" fill="#f59e0b" />
  <circle cx="99" cy="51" r="5" fill="#10b981" />
  <rect x="150" y="43" width="320" height="18" rx="9" fill="#090d16" />
  <text x="170" y="56" fill="#a855f7" font-family="monospace" font-size="10.5">vision-pulse.ai/stream/esp32-cv-engine [OpenCV + PyTorch]</text>
  
  <rect x="635" y="43" width="105" height="18" rx="9" fill="#3b0764" />
  <circle cx="647" cy="52" r="3.5" fill="#a855f7" />
  <text x="656" y="55" fill="#e9d5ff" font-family="sans-serif" font-size="9.5" font-weight="bold">60 FPS LIVE</text>

  <!-- Video Feed Simulation Viewport -->
  <rect x="65" y="95" width="450" height="330" rx="10" fill="#020617" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Scanlines overlay -->
  <rect x="65" y="160" width="450" height="70" fill="url(#neon-scan)" />

  <!-- Camera HUD Crosshairs -->
  <line x1="75" y1="105" x2="105" y2="105" stroke="#38bdf8" stroke-width="2" />
  <line x1="75" y1="105" x2="75" y2="135" stroke="#38bdf8" stroke-width="2" />

  <line x1="505" y1="105" x2="475" y2="105" stroke="#38bdf8" stroke-width="2" />
  <line x1="505" y1="105" x2="505" y2="135" stroke="#38bdf8" stroke-width="2" />

  <line x1="75" y1="415" x2="105" y2="415" stroke="#38bdf8" stroke-width="2" />
  <line x1="75" y1="415" x2="75" y2="385" stroke="#38bdf8" stroke-width="2" />

  <line x1="505" y1="415" x2="475" y2="415" stroke="#38bdf8" stroke-width="2" />
  <line x1="505" y1="415" x2="505" y2="385" stroke="#38bdf8" stroke-width="2" />

  <!-- Object Detection Bounding Box 1 (Person) -->
  <rect x="140" y="140" width="160" height="240" rx="4" fill="rgba(168, 85, 247, 0.08)" stroke="#a855f7" stroke-width="2" stroke-dasharray="8,4" />
  <rect x="140" y="122" width="130" height="18" rx="3" fill="#a855f7" />
  <text x="146" y="135" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold">Person: 98.6%</text>

  <!-- Keypoint Pose Skeleton lines -->
  <circle cx="220" cy="180" r="14" fill="none" stroke="#38bdf8" stroke-width="2" /> <!-- Head -->
  <line x1="220" y1="194" x2="220" y2="280" stroke="#38bdf8" stroke-width="2" /> <!-- Spine -->
  <line x1="220" y1="215" x2="180" y2="250" stroke="#38bdf8" stroke-width="2" /> <!-- Left Arm -->
  <line x1="180" y1="250" x2="160" y2="230" stroke="#10b981" stroke-width="2" /> <!-- Left Hand Gesture -->
  <line x1="220" y1="215" x2="260" y2="250" stroke="#38bdf8" stroke-width="2" /> <!-- Right Arm -->
  <line x1="260" y1="250" x2="275" y2="290" stroke="#38bdf8" stroke-width="2" />

  <circle cx="160" cy="230" r="6" fill="#10b981" />
  <text x="95" y="225" fill="#10b981" font-family="monospace" font-size="9">Gesture: Peace</text>

  <!-- Object Detection Bounding Box 2 (Laptop/IoT Hardware) -->
  <rect x="330" y="270" width="140" height="110" rx="4" fill="rgba(6, 182, 212, 0.08)" stroke="#06b6d4" stroke-width="2" />
  <rect x="330" y="252" width="120" height="18" rx="3" fill="#06b6d4" />
  <text x="336" y="265" fill="#0f172a" font-family="monospace" font-size="10" font-weight="bold">IoT Edge: 95.2%</text>

  <!-- Right Column: Model Metrics & Telemetry -->
  <g transform="translate(535, 95)">
    <rect width="200" height="330" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1" />
    <text x="15" y="30" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="bold">🧠 Neural Telemetry</text>

    <text x="15" y="65" fill="#94a3b8" font-family="sans-serif" font-size="10">BACKBONE MODEL</text>
    <text x="15" y="85" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">YOLOv8 + PyTorch</text>

    <text x="15" y="118" fill="#94a3b8" font-family="sans-serif" font-size="10">INFERENCE LATENCY</text>
    <text x="15" y="138" fill="#10b981" font-family="monospace" font-size="14" font-weight="bold">16.4 ms / frame</text>

    <text x="15" y="172" fill="#94a3b8" font-family="sans-serif" font-size="10">EDGE HARDWARE</text>
    <text x="15" y="192" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">ESP32-CAM WiFi</text>

    <text x="15" y="226" fill="#94a3b8" font-family="sans-serif" font-size="10">STREAM RESOLUTION</text>
    <text x="15" y="246" fill="#e2e8f0" font-family="monospace" font-size="12">1280x720 HD</text>

    <rect x="15" y="275" width="170" height="36" rx="6" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1" />
    <text x="30" y="297" fill="#c084fc" font-family="sans-serif" font-size="10.5" font-weight="bold">● ACTIVE TRACKING</text>
  </g>
</svg>
